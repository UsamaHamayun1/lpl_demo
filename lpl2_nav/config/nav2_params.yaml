# lpl2_nav: Nav2 (Jazzy) for TurtleBot3 waffle_pi in the LPL 2.0 corridor.
#
# This is the robot's ordinary autonomy ("same intelligence"). It knows nothing about LPL.
# LPL constrains it from the outside only through the keepout mask on /keepout_mask
# (which areas may be used) and, later, an execution gate on cmd_vel.
#
# The mask enters both costmaps as a second StaticLayer ("keepout_layer") BEFORE inflation,
# combined by maximum (use_maximum at the costmap level; per-layer it is silently ignored).
# (Nav2's KeepoutFilter is applied after inflation, so the planner put the robot centre on
# the zone boundary and pure pursuit then refused to move: "collision ahead".)
#
# Velocity chain (all TwistStamped):
#   controller_server -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#     -> collision_monitor -> <cmd_vel_out launch arg, default /cmd_vel>
# Localization is simulator truth (static map->odom from lpl2_sim), so no AMCL.
# No behavior_server: the behaviour trees have no recoveries (see behavior_trees/).

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    transform_tolerance: 0.5
    filter_duration: 0.3
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: $(find-pkg-share lpl2_nav)/behavior_trees/navigate_to_pose_no_recovery.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share lpl2_nav)/behavior_trees/navigate_through_poses_no_recovery.xml
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.5
    FollowPath:
      # Pure pursuit tracks the planned path closely, so lane discipline comes from the planner
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.26
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

# waffle_pi footprint (base plate + wheels)
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      use_maximum: true    # StaticLayers combine by max (Jazzy: costmap-level param, not per layer)
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.205, -0.155], [-0.205, 0.155], [0.077, 0.155], [0.077, -0.155]]"
      plugins: ["keepout_layer", "obstacle_layer", "inflation_layer"]
      keepout_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /keepout_mask
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.5
          obstacle_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: false
      use_maximum: true    # keepout_layer adds to the walls instead of overwriting them
      footprint: "[[-0.205, -0.155], [-0.205, 0.155], [0.077, 0.155], [0.077, -0.155]]"
      plugins: ["static_layer", "keepout_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      keepout_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /keepout_mask
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.5
          obstacle_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 1.5]
    min_velocity: [-0.30, 0.0, -1.5]
    max_accel: [1.5, 0.0, 3.2]
    max_decel: [-2.0, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"      # overridden by the cmd_vel_out launch argument
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true

map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: map
    # yaml_filename set by the launch file (lpl2_sim/maps/corridor.yaml)

keepout_mask_server:
  ros__parameters:
    use_sim_time: true
    topic_name: /keepout_mask
    frame_id: map
    # yaml_filename set by the launch file (the mask launch argument)

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names:
      - map_server
      - keepout_mask_server
      - planner_server
      - controller_server
      - velocity_smoother
      - collision_monitor
      - bt_navigator
