# LPL 2.0 corridor: single source of truth for the world, the Nav2 map and the zone masks.
# Regenerate after editing:  python3 tools/gen_corridor.py
#
# Frame: x = Robot R's travel direction (east), y = Lane 1 side (north), z up. Metres.
# Lane 1 (oncoming, westbound): y 0 .. 1.2    Lane 2 (Robot R, eastbound): y -1.2 .. 0
# Option A = pass the pallet by borrowing Lane 1 (needs P3).
# Option B = service bypass south of Lane 2 (never touches Lane 1).

world_name: lpl2_corridor
hidden_z: -5.0          # scripted boxes are parked here when not present

colors:
  wall:    [0.55, 0.35, 0.25, 1]
  block:   [0.45, 0.45, 0.50, 1]
  pallet:  [1.00, 0.85, 0.00, 1]
  stack:   [0.60, 0.10, 0.10, 1]
  shutter: [1.00, 0.45, 0.00, 1]
  robot2:  [1.00, 0.00, 1.00, 1]
  floor:   [0.50, 0.50, 0.50, 1]
  marking: [1.00, 1.00, 1.00, 1]

# Static boxes: collision + visual in the world, and drawn into the Nav2 map.
static_boxes:
  # main corridor shell (south wall has a door to the bypass at x 8.4-9.6 and 17.4-18.6)
  wall_north:   {x: [-1.2, 27.0], y: [1.2, 1.4],   z: [0, 2.0], color: wall}
  wall_west:    {x: [-1.2, -1.0], y: [-1.4, 1.4],  z: [0, 2.0], color: wall}
  wall_south_a: {x: [-1.2, 8.4],  y: [-1.4, -1.2], z: [0, 2.0], color: wall}
  wall_south_b: {x: [18.6, 28.6], y: [-1.4, -1.2], z: [0, 2.0], color: wall}
  # east cross-aisle where Robot 2 waits out of sight
  aisle_west:   {x: [26.8, 27.0], y: [1.4, 4.2],   z: [0, 2.0], color: wall}
  aisle_east:   {x: [28.4, 28.6], y: [-1.4, 4.2],  z: [0, 2.0], color: wall}
  aisle_north:  {x: [26.8, 28.6], y: [4.0, 4.2],   z: [0, 2.0], color: wall}
  # service bypass (Option B): entry door x 8.4-9.6, run y -4.0..-2.8, exit door x 17.4-18.6
  bypass_block: {x: [9.6, 17.4],  y: [-2.8, -1.2], z: [0, 2.0], color: block}
  bypass_west:  {x: [8.2, 8.4],   y: [-4.2, -1.4], z: [0, 2.0], color: wall}
  bypass_east:  {x: [18.6, 18.8], y: [-4.2, -1.4], z: [0, 2.0], color: wall}
  bypass_south: {x: [8.2, 18.8],  y: [-4.2, -4.0], z: [0, 2.0], color: wall}
  # Lane 2 obstacle, low part (pallet). Above the lidar plane (~0.13 m), below the raised camera.
  obstacle_low: {x: [13.0, 14.0], y: [-1.2, -0.05], z: [0, 0.30], color: pallet}

# Scripted boxes: moved in/out by the scenario director (set_pose). Not in the Nav2 map:
# the robot has to find out about them like any real change.
scripted_boxes:
  obstacle_tall:  {x: [13.0, 14.0], y: [-1.2, -0.05], z: [0.30, 1.80], color: stack}
  bypass_shutter: {x: [8.4, 9.6],   y: [-1.40, -1.25], z: [0, 1.90], color: shutter}

# Visual-only floor markings (no collision; below the lidar plane).
centerline: {y: 0.0, x_start: -0.5, x_end: 27.0, dash: 0.6, gap: 0.6, width: 0.06}

# Named regions used by the permission/planner layers and drawn by the dashboard.
# Keepout masks are generated from lane1, lane1_window and lane1_margin.
zones:
  lane1:          {x: [-1.0, 27.0], y: [0.0, 1.2]}     # whole oncoming lane
  lane1_window:   {x: [10.5, 17.0], y: [0.0, 1.2]}     # P3 region: Lane 1 may be used only here
  lane2:          {x: [-1.0, 27.0], y: [-1.2, 0.0]}    # Robot R's own lane
  bypass:         {x: [8.4, 18.6],  y: [-4.0, -1.2]}   # service bypass (Option B)
  bypass_commit:  {x: [8.4, 9.6],   y: [-2.8, -1.2]}   # inside the entry door = committed to Option B
  lane1_margin: 0.35                                   # masks reach this far into Lane 2 (keeps the body out of Lane 1)

robot_r:
  spawn: [0.0, -0.6, 0.0]   # x, y, yaw
  goal:  [24.0, -0.6, 0.0]
  camera_height: 0.45       # stock waffle_pi camera is ~0.10 m: too low to see over the pallet
  camera_size: [1280, 720]
  camera_rate: 15

robot2:
  size: [0.9, 0.6, 1.1]
  mass: 20.0
  park: [27.7, 3.2, -1.5708]               # hidden in the cross-aisle, facing south
  route: [[27.7, 0.6], [26.5, 0.6], [0.8, 0.6]]   # into Lane 1, then westbound
  speed: 0.4

cameras:
  topdown: {pose: [13.7, 0.0, 22.0], hfov: 1.25, size: [1600, 500], rate: 15}

map:
  resolution: 0.05
  origin: [-2.0, -5.0]
  size: [32.0, 10.0]
